name: Storage backend and client
on:
  push:
    paths: ['backend/**', 'client/**', '.github/workflows/storage.yml']
  pull_request:
    paths: ['backend/**', 'client/**', '.github/workflows/storage.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - run: go -C backend test -race ./...
      - run: go -C backend vet ./...
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S client -B build/client -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/client -j 2
      - run: ctest --test-dir build/client --output-on-failure
