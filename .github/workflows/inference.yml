name: CPU inference launcher
on:
  push:
    paths: ['inference/**', '.github/workflows/inference.yml']
  pull_request:
    paths: ['inference/**', '.github/workflows/inference.yml']
jobs:
  launcher:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s inference/tests -v
  rpc-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 8ca4060b7e30e76baaa5670ee1ec1b760b7f8552
          path: vendor/llama.cpp
          persist-credentials: false
      - run: cmake -S vendor/llama.cpp -B vendor/build -DCMAKE_BUILD_TYPE=Release -DGGML_RPC=ON -DGGML_CUDA=OFF -DGGML_METAL=OFF -DGGML_VULKAN=OFF -DGGML_SYCL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF
      - run: cmake --build vendor/build --target ggml-rpc-server llama-server -j 2
      - run: curl --fail --location --retry 3 https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories15M-q4_0.gguf -o vendor/stories15M.gguf
      - run: echo "66967fbece6dbe97886593fdbb73589584927e29119ec31f08090732d1861739  vendor/stories15M.gguf" | sha256sum --check
      - run: python inference/smoke_test.py --bin-dir vendor/build/bin --model vendor/stories15M.gguf
